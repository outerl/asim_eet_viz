[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asim-eet-viz"
version = "0.1.0"
description = "Base-vs-build ActivitySim visualization notebooks and compilation tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.0.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
    "nbparameterise>=0.6.1",
    "numpy>=2.0.0",
    "openpyxl",
    "openmatrix",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools]
packages = []
py-modules = []
